name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Escape hatch: re-run a release from the Actions tab when the push-triggered
  # run didn't publish. Without it the only way back is an empty commit on main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}

    steps:
      # The Release PR is pushed and opened by this App, not by
      # `github-actions[bot]`. Since June 2026 GitHub holds every `pull_request`
      # run on a bot-authored PR at `action_required` when the default
      # GITHUB_TOKEN is what touched it -- one manual "Approve and run" per push
      # to the Release PR, so on every merge to main. An App installation token
      # is a trusted identity, so those runs start on their own.
      #
      # It has to be minted before the checkout, not next to the step that
      # needs it: `actions/checkout` persists its own token in the remote URL,
      # and that is the credential `changesets/action` pushes the branch with.
      # Pass it here or the push carries `github-actions[bot]` whatever the API
      # calls use. On a run that mints nothing -- a PR, where a fork has no
      # access to the secret anyway -- the fallback is the default token.
      - name: Mint an App token
        id: app-token
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lgtm

      #
      # Changeset
      #

      # npm auth is npm trusted publishing (OIDC) — no NPM_TOKEN. The trusted
      # publisher declared on npmjs.com names *this* workflow file, so moving or
      # renaming it breaks publishing with ENEEDAUTH. Setting an NPM_TOKEN secret
      # would also break it: changesets/action then writes an .npmrc and skips OIDC.
      - name: Create Release Pull Request or Publish
        id: changesets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Check version bump
        id: check
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: EndBug/version-check@v2
        with:
          diff-search: true

      - name: Get version
        id: get-version
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Released version: $VERSION"

  #
  # Figma plugin -- only on version bump (release merge)
  #
  # Built and attached to the GitHub Release as a zip, then published by hand
  # from the Figma desktop app (Plugins > Manage plugins > Publish new version).
  # Figma's public REST API has no endpoint for publishing a plugin version:
  # the `POST /v1/plugins/{id}/versions` this job used to call answered 404.
  #

  figma-plugin:
    needs: ci
    if: needs.ci.outputs.changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Build Figma plugin
        run: pnpm run build-figma

      # The release itself is created by `changesets/action` in the `ci` job,
      # which this one waits on.
      - name: Attach Figma plugin to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v${{ needs.ci.outputs.version }}"
          ZIP="figma-plugin-${TAG}.zip"

          # Read file paths from manifest.json so CI stays in sync automatically
          cd figma-plugin
          MAIN=$(jq -r '.main' manifest.json)
          UI=$(jq -r '.ui' manifest.json)
          zip "../${ZIP}" manifest.json "$MAIN" "$UI"
          cd ..

          gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached ${ZIP} to ${TAG}"
